# Nginx reverse proxy for the Sanos app container (docker-compose service "app").
# Serves HTTP on :80. For production, add a TLS server block (certs via certbot
# or an upstream ALB) and redirect 80 -> 443.

upstream sanos_app {
    server app:3000;
}

server {
    listen 80;
    server_name _;

    # Reasonable proxy defaults for a Next.js app.
    location / {
        proxy_pass http://sanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Long-cache the immutable Next.js build assets.
    location /_next/static/ {
        proxy_pass http://sanos_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
