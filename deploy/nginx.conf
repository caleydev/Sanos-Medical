# Nginx reverse proxy for the Sanos app container (docker-compose service "app").
#
# Serves HTTPS on :443 (Let's Encrypt certs, terminated here) and redirects all
# plain HTTP on :80 to HTTPS — except the ACME challenge path, which must stay on
# HTTP so certbot can renew. Certs are obtained/renewed by the `certbot` service;
# see deploy/init-tls.sh for first-time issuance.
#
# NOTE: the :443 block references cert files under /etc/letsencrypt. nginx will
# not start if they are missing, so deploy/init-tls.sh drops a throwaway
# self-signed cert into place before the first real issuance.

upstream sanos_app {
    server app:3000;
}

# HTTP :80 — ACME challenges + redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name sanosmedical.com www.sanosmedical.com;

    # Let's Encrypt webroot challenge (kept on HTTP for issuance + renewal).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS :443 — TLS termination, reverse proxy to the Next.js app.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sanosmedical.com www.sanosmedical.com;

    ssl_certificate     /etc/letsencrypt/live/sanosmedical.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanosmedical.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Reasonable proxy defaults for a Next.js app.
    location / {
        proxy_pass http://sanos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Long-cache the immutable Next.js build assets.
    location /_next/static/ {
        proxy_pass http://sanos_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
