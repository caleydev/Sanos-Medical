# EC2 deployment: Next.js app behind Nginx (reverse proxy / TLS termination).
#
#   docker compose up -d --build
#
# Secrets come from .env on the host (never committed) — see .env.example.

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* must be baked in at build time. Compose interpolates these
      # ${...} from the host .env; env_file below only covers runtime vars.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.example.com}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # For TLS, terminate here (mount certs) or front with an ALB. See README.
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro   # uncomment when adding TLS
