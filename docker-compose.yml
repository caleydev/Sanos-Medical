# EC2 deployment: Next.js app behind Nginx (reverse proxy / TLS termination).
#
#   docker compose up -d --build
#
# Secrets come from .env on the host (never committed) — see .env.example.

services:
  app:
    build:
      context: .
      # NEXT_PUBLIC_* must be baked in at build time. Compose interpolates these
      # ${...} from the host .env; env_file below only covers runtime vars.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_PORTAL_URL: ${NEXT_PUBLIC_PORTAL_URL:-https://portal.example.com}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_CALENDLY_URL: ${NEXT_PUBLIC_CALENDLY_URL:-}
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certs + ACME webroot, shared with the certbot service.
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro

  # On-demand only (excluded from `docker compose up` by its profile). Used by
  # deploy/init-tls.sh for first issuance and by the renewal cron. See README.
  certbot:
    image: certbot/certbot
    profiles: ["tls"]
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
