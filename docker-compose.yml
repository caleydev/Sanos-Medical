# EC2 deployment: Next.js app behind Nginx (reverse proxy / TLS termination).
#
#   docker compose up -d --build
#
# Secrets come from .env on the host (never committed) — see .env.example.

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # For TLS, terminate here (mount certs) or front with an ALB. See README.
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./deploy/certs:/etc/nginx/certs:ro   # uncomment when adding TLS
